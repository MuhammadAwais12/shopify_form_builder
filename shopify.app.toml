
client_id = "b05cb972426fc812edf61fcc4890a824"
name = "Form-builder"
application_url = "https://shopifyformbuilder-8znu.vercel.app"
embedded = true

[access_scopes]
scopes = "write_products,read_products,write_app_proxy"

[auth]
redirect_urls = [
  "https://shopifyformbuilder-8znu.vercel.app/auth/callback",
  "https://shopifyformbuilder-8znu.vercel.app/auth/login"
]

[webhooks]
api_version = "2027-01"

[[webhooks.subscriptions]]
uri = "/webhooks/app/uninstalled"
topics = ["app/uninstalled"]

[[webhooks.subscriptions]]
uri = "/webhooks/app/scopes_update"
topics = ["app/scopes_update"]

[app_proxy]
url = "https://shopifyformbuilder-8znu.vercel.app/apps/forms"
subpath = "forms"
prefix = "apps"

[build]
automatically_update_urls_on_dev = false